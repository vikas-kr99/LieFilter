<!DOCTYPE html>
<html>

<head>

    <title>LieFilter Login</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <div class="logo">
        LieFilter
    </div>

</header>

<section class="hero">

    <div class="login-box">

        <h1>Admin Login</h1>

        <input type="text"
        id="username"
        placeholder="Enter Username">

        <br><br>

        <input type="password"
        id="password"
        placeholder="Enter Password">

        <br><br>

        <button onclick="login()">
            Login
        </button>

    </div>

</section>

<script src="js/login.js"></script>

</body>

</html>
